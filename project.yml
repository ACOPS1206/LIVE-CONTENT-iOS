name: LiveContent
options:
  bundleIdPrefix: kr.acops
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: false
targets:
  LiveContent:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Live Content
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: Select a photo to show as a small Live Activity thumbnail.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.acops.livecontent
        PRODUCT_NAME: LiveContent
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    dependencies:
      - target: LiveContentWidgets
        embed: true
  LiveContentWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Live Content
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.acops.livecontent.widgets
        PRODUCT_NAME: LiveContentWidgets
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
schemes:
  LiveContent:
    build:
      targets:
        LiveContent: all
        LiveContentWidgets: all
    run:
      config: Debug
    archive:
      config: Release
